[workspace]
resolver = "3"
members = [
    "crates/luar-ast",
    "crates/luar-diagnostics",
    "crates/luar-lexer",
    "crates/luar-parser",
    "crates/luar-sema",
    "crates/luar-lir",
    "crates/luar-codegen",
    "crates/luar-conformance",
    "crates/luar-driver",
    "crates/luarc",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/OMouta/luaR"

[workspace.dependencies]
luar-ast = { path = "crates/luar-ast" }
luar-diagnostics = { path = "crates/luar-diagnostics" }
luar-lexer = { path = "crates/luar-lexer" }
luar-parser = { path = "crates/luar-parser" }
luar-sema = { path = "crates/luar-sema" }
luar-lir = { path = "crates/luar-lir" }
luar-codegen = { path = "crates/luar-codegen" }
luar-conformance = { path = "crates/luar-conformance" }
luar-driver = { path = "crates/luar-driver" }

# Cranelift is versioned 0.x and moves quickly, so the version is exact and
# bumping it is its own change.
cranelift-codegen = "=0.125.4"
cranelift-frontend = "=0.125.4"
cranelift-native = "=0.125.4"
cranelift-module = "=0.125.4"
cranelift-object = "=0.125.4"
target-lexicon = "=0.13.5"
wasm-encoder = { version = "=0.256.0", default-features = false, features = ["std"] }
wasmparser = "=0.256.0"
cc = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
