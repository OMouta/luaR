name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml names the version, the components, and the
      # profile, so this installs what the repository asks for rather than
      # whatever `stable` happens to be today.
      - name: Install Rust
        run: rustup toolchain install

      - name: Format
        run: cargo fmt --all --check

      # Warnings fail the build. A warning nobody has to fix is a warning
      # everybody stops reading.
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      # Runs the conformance suite along with everything else.
      - name: Test
        run: cargo test --workspace
