name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install

      - name: Install Rokit
        uses: CompeyDev/setup-rokit@v0.2.1

      - name: Format
        run: cargo fmt --all --check

      - name: Format Luau
        run: stylua --check luar.luau

      # Warnings fail the build. A warning nobody has to fix is a warning
      # everybody stops reading.
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      # Runs the conformance suite along with everything else.
      - name: Test
        run: cargo test --workspace

  msrv:
    # Matches `rust-version` in Cargo.toml.
    name: rust 1.88.0
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Build
        run: cargo +1.88.0 build --workspace

      - name: Test
        run: cargo +1.88.0 test --workspace
